# Verification-only change; the workflow below matches the published configuration.
name: Markdown

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  flow:
    name: Clean Flow
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check pull request direction
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          if [[ "$BASE_BRANCH" == "main" ]]; then
            if [[ "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
              echo "Only this repository's dev branch can be promoted to main."
              exit 1
            fi
          elif [[ "$BASE_BRANCH" != "dev" || "$HEAD_BRANCH" == "main" ]]; then
            echo "Work branches must target dev; promotions must go from dev to main."
            exit 1
          fi
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint Markdown
        run: npm run lint
